services:
  # Development environment container to run npm/node commands
  dev:
    image: node:20-alpine
    container_name: hydra-dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./:/app
      - dev_node_modules:/app/node_modules
    env_file:
      - .env
    command: tail -f /dev/null

  # Next.js Web App dev server
  web:
    image: node:20-alpine
    container_name: hydra-web
    working_dir: /app/apps/web
    volumes:
      - ./:/app
      # Isolated volumes in Docker's Linux filesystem — avoids WSL↔Windows I/O bottleneck
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next_cache:/app/apps/web/.next
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://postgres:password@db:5432/hydradb
      - NEXT_TELEMETRY_DISABLED=1
    command: sh -c "cd /app && npm install && npx turbo run build --filter=@hydra/backend-core && npm run db:push --workspace=@hydra/backend-core && cd apps/web && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  # Dedicated explicit profile for running the data enrichment script
  enrich:
    image: node:20-alpine
    container_name: hydra-enrich
    profiles: ["enrich"]
    working_dir: /app/apps/backend
    volumes:
      - ./:/app
      - dev_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/hydradb
    command: sh -c "cd /app && npm install && npx turbo run build --filter=@hydra/backend-core && cd apps/backend && npm run start"
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL Database for the application
  db:
    image: postgres:15-alpine
    container_name: hydra-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hydradb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hydradb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  dev_node_modules:
  web_node_modules:
  web_app_node_modules:
  web_next_cache:
