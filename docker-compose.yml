services:
  # Next.js Frontend (BFF)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: localhost/hydra-web
    container_name: hydra-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - API_URL=http://api:3001
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - api

  # Hono API Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: localhost/hydra-api
    container_name: hydra-api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:password@db:5432/hydradb
    depends_on:
      db:
        condition: service_healthy

  # Dedicated explicit profile for running the data enrichment script
  enrich:
    image: docker.io/library/node:20-alpine
    container_name: hydra-enrich
    profiles: ["enrich"]
    working_dir: /app/apps/backend
    volumes:
      - ./:/app
      - dev_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/hydradb
    command: sh -c "cd /app && npm install && cd packages/backend-core && npm run db:push && cd /app && npx turbo run build --filter=@hydra/backend-core --no-daemon --no-cache && cd apps/backend && npm run start"
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL Database for the application
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: hydra-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hydradb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hydradb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  dev_node_modules: