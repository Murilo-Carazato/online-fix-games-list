# declaro os 3 serviços
services:

  # Frontend (Next.js)
  web:

    # aponto onde está o dockerfile
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    # dou nome para a imagem
    image: localhost/hydra-web

    # dou nome para o container
    container_name: hydra-web

    # expõe a porta 3000 apenas na rede interna do Docker (o proxy do Coolify redireciona o domínio HTTPS para cá sem conflitar com outros alunos no servidor)
    expose:
      - "3000"
    
    environment:
      - NODE_ENV=production
      
      # Ignora erros de SSL/TLS (UNABLE_TO_VERIFY_LEAF_SIGNATURE) ao baixar imagens externas no Next.js
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      
      # permite coneções externas
      - HOSTNAME=0.0.0.0

      # aponto o endereço da api; 'api' é o nome do container, e ':3001' é a porta que eu exponho no dockerfile da api
      - API_URL=http://api:3001

      # por padrão, o NEXT envia dados de uso dos DEVs para a vercel, usando recursos a mais
      - NEXT_TELEMETRY_DISABLED=1
    
    # O container WEB só liga se o container da API já estiver ligada e saudável.
    depends_on:
      api:
        condition: service_healthy

  # API(Hono)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: localhost/hydra-api
    container_name: hydra-api
    expose:
      - "3001"
    environment:
      - NODE_ENV=production

      # conexão com o banco de dados, apontando para o contêiner "db"
      - DATABASE_URL=postgres://postgres:password@db:5432/hydradb
    
    # Pinga a API para saber se ela já está aceitando requisições
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    # O container API só liga se o container do banco de dados já estiver ligada.
    depends_on:
      db:
        condition: service_healthy



  db:

    # não criei dockerfile, usei a imagem já pronta do docker para o postgres
    image: docker.io/library/postgres:15-alpine
    container_name: hydra-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hydradb
    expose:
      - "5432"

    # Pega a partição 'pgdata' e salva os dados do banco de dados nela(path onde a imagem do postgres guarda os dados), para que ao finalizar o container, ainda existir o volume com os dados
    volumes:
      - pgdata:/var/lib/postgresql/data

    # Crio um serviço que fica "pingando" o banco (pg_isready) a cada 5 segundos para avisar a API que ele já ligou
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hydradb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

# Declara os volumes
volumes:

  # Cria uma partição no meu SO com o nome de 'pgdata'
  pgdata: